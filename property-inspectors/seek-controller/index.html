<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 13px; color: #ccc; padding: 16px; background: #1e1e1e; }
    label { display: block; margin-bottom: 4px; color: #aaa; }
    input { width: 100%; box-sizing: border-box; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
    .row { margin-bottom: 12px; }
    p { margin: 12px 0 0; color: #777; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="row">
    <label>Seek Step (seconds)</label>
    <input type="number" id="seekStep" min="1" max="120" value="15"/>
  </div>
  <p>Rotate to seek forward or back by the step value.<br>Press to restart the track from the beginning.</p>
  <script>
    const input = document.getElementById('seekStep');
    window.addEventListener('message', e => {
      const d = e.data;
      if (d && d.seekStep) input.value = d.seekStep;
    });
    input.addEventListener('change', () => {
      window.parent.postMessage({ seekStep: parseInt(input.value, 10) || 15 }, '*');
    });
  </script>
</body>
</html>

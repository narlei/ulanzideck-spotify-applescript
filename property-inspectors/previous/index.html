  align-items: baseline;
}

.sdpi-item-label {
  text-align: right;
  flex: none;
  width: 94px;
  padding-right: 5px;
  font-weight: 600;
  -webkit-user-select: none;
  line-height: normal;
  margin-left: -1px;
}

.win .sdpi-item-label,
.sdpi-item-label > small {
  font-weight: normal;
}

.sdpi-item-label:after {
  content: ': ';
}

.sdpi-item-label.empty:after {
  content: '';
}

.sdpi-test,
.sdpi-item-value {
  flex: 1 0 0;
  /* flex-grow: 1;
  flex-shrink: 0; */
  margin-right: 14px;
  margin-left: 4px;
  justify-content: space-evenly;
}

canvas.sdpi-item-value {
  max-width: 144px;
  max-height: 144px;
  width: 144px;
  height: 144px;
  margin: 0 auto;
  cursor: pointer;
}

input.sdpi-item-value {
  margin-left: 5px;
}

.sdpi-item-value button,
button.sdpi-item-value {
  margin-left: 6px;
  margin-right: 14px;
}

.sdpi-item-value.range {
  margin-left: 0px;
}

table,
dl.sdpi-item-value,
ul.sdpi-item-value,
ol.sdpi-item-value,
.sdpi-item-value > dl,
.sdpi-item-value > ul,
.sdpi-item-value > ol {
  list-style-type: none;
  list-style-position: outside;
  margin-left: -4px;
  margin-right: -4px;
  padding: 4px;
  border: 1px solid var(--sdpi-bordercolor);
}

dl.sdpi-item-value,
ul.sdpi-item-value,
ol.sdpi-item-value,
.sdpi-item-value > ol {
  list-style-type: none;
  list-style-position: inside;
  margin-left: 5px;
  margin-right: 12px;
  padding: 4px !important;
  /* display: flex;
  flex-direction: column; */
}

.two-items li {
  display: flex;
}

.two-items li > *:first-child {
  flex: 0 0 50%;
  text-align: left;
}

.two-items.thirtyseventy li > *:first-child {
  flex: 0 0 30%;
}

ol.sdpi-item-value,
.sdpi-item-value > ol[listtype='none'] {
  list-style-type: none;
}

ol.sdpi-item-value[type='decimal'],
.sdpi-item-value > ol[type='decimal'] {
  list-style-type: decimal;
}

ol.sdpi-item-value[type='decimal-leading-zero'],
.sdpi-item-value > ol[type='decimal-leading-zero'] {
  list-style-type: decimal-leading-zero;
}

ol.sdpi-item-value[type='lower-alpha'],
.sdpi-item-value > ol[type='lower-alpha'] {
  list-style-type: lower-alpha;
}

ol.sdpi-item-value[type='upper-alpha'],
.sdpi-item-value > ol[type='upper-alpha'] {
  list-style-type: upper-alpha;
}

ol.sdpi-item-value[type='upper-roman'],
.sdpi-item-value > ol[type='upper-roman'] {
  list-style-type: upper-roman;
}

ol.sdpi-item-value[type='lower-roman'],
.sdpi-item-value > ol[type='lower-roman'] {
  list-style-type: upper-roman;
}

tr:nth-child(even),
.sdpi-item-value > ul > li:nth-child(even),
.sdpi-item-value > ol > li:nth-child(even),
li:nth-child(even) {
  background-color: rgba(0, 0, 0, 0.2);
}

td:hover,
.sdpi-item-value > ul > li:hover:nth-child(even),
.sdpi-item-value > ol > li:hover:nth-child(even),
li:hover:nth-child(even),
li:hover {
  background-color: rgba(255, 255, 255, 0.1);
}

td.selected,
td.selected:hover,
li.selected:hover,
li.selected {
  color: white;
  background-color: #77f;
}

tr {
  border: 1px solid var(--sdpi-bordercolor);
}

td {
  border-right: 1px solid var(--sdpi-bordercolor);
  -webkit-user-select: none;
}

tr:last-child,
td:last-child {
  border: none;
}

.sdpi-item-value.select,
.sdpi-item-value > select {
  margin-right: 13px;
  margin-left: 4px;
  padding: 0px 4px;
}

.sdpi-item-child,
.sdpi-item-group > .sdpi-item > input[type='color'] {
  margin-top: 0.4em;
  margin-right: 4px;
  margin-left: 4px;
}

.full,
.full *,
.sdpi-item-value.full,
.sdpi-item-child > full > *,
.sdpi-item-child.full,
.sdpi-item-child.full > *,
.full > .sdpi-item-child,
.full > .sdpi-item-child > * {
  display: flex;
  flex: 1 1 0;
  margin-bottom: 4px;
  margin-left: 0px;
  width: 100%;
  justify-content: space-evenly;
}

.sdpi-item-group > .sdpi-item > input[type='color'] {
  margin-top: 0px;
}

::-webkit-calendar-picker-indicator:focus,
input[type='file']::-webkit-file-upload-button:focus,
button:focus,
textarea:focus,
input:focus,
select:focus,
option:focus,
details:focus,
summary:focus,
.custom-select select {
  outline: none;
}

summary {
  cursor: default;
  -webkit-user-select: none;
}

.pointer,
summary .pointer {
  cursor: pointer;
}

.sdpi-item.details {
  align-items: first baseline;
}

/* needs Chromium update 2023
.sdpi-item:has(>details) {
    align-items: first baseline;
}
*/

details * {
  font-size: 12px;
  font-weight: normal;
}

details.message {
  padding: 4px 18px 4px 12px;
}

details.message summary {
  font-size: 10pt;
  font-weight: 600;
  min-height: 18px;
}

details.message:first-child {
  margin-top: 4px;
  margin-left: 0;
  padding-left: 102px !important;
}

details.message > summary:first-of-type {
  line-height: 20px;
}

details.message h1 {
  text-align: left;
}

details.message h2 {
  text-align: left;
}

details:not(.pointer) > summary {
  list-style: none;
}

details.message.no-marker > summary::-webkit-details-marker {
  display: none;
}

.question,
.caution,
.info {

.sdpi-more-info {
  position: fixed;
  left: 0px;
  right: 0px;
  bottom: 0px;
  min-height: 16px;
  padding-right: 16px;
  text-align: right;
  -webkit-touch-callout: none;
  cursor: pointer;
  user-select: none;
  background-position: right center;
  background-repeat: no-repeat;
  border-radius: var(--sdpi-borderradius);
  text-decoration: none;
  color: var(--sdpi-color);
}

.sdpi-more-info-button {
  display: flex;
  align-self: right;
  margin-left: auto;
  position: fixed;
  right: 17px;
  bottom: 0px;
  user-select: none;
}

.sdpi-bottom-bar {
  display: flex;
  align-self: right;
  margin-left: auto;
  position: fixed;
  right: 17px;
  bottom: 0px;
  user-select: none;
}

.sdpi-bottom-bar.right {
  right: 0px;
}

.sdpi-bottom-bar button {
  min-height: 20px !important;
  height: 20px !important;
}

details a {
  background-position: right !important;
  min-height: 24px;
  display: inline-block;
  line-height: 24px;
  padding-right: 28px;
}

input:not([type='range']),
textarea {
  -webkit-appearance: none;
  background: var(--sdpi-background);
  color: var(--sdpi-color);
  font-weight: normal;
  font-size: 9pt;
  border: none;
  margin-top: 2px;
  margin-bottom: 2px;
  min-width: 219px;
}

textarea + label {
  display: flex;
  justify-content: flex-end;
}

input[type='radio'],
input[type='checkbox'] {
  display: none;
}

input[type='radio'] + label,
input[type='checkbox'] + label {
  font-size: 9pt;
  color: var(--sdpi-color);
  font-weight: normal;
  margin-right: 8px;
  -webkit-user-select: none;
}

input[type='radio'] + label:after,
input[type='checkbox'] + label:after {
  content: ' ' !important;
}

.sdpi-item[type='radio'] > .sdpi-item-value,
.sdpi-item[type='checkbox'] > .sdpi-item-value {
  padding-top: 2px;
}

.sdpi-item[type='checkbox'] > .sdpi-item-value > * {
  margin-top: 4px;
}

.sdpi-item[type='checkbox'] .sdpi-item-child,
.sdpi-item[type='radio'] .sdpi-item-child {
  display: inline-block;
}

.sdpi-item[type='range'] .sdpi-item-value,
.sdpi-item[type='meter'] .sdpi-item-child,
.sdpi-item[type='progress'] .sdpi-item-child {
  display: flex;
}

.sdpi-item[type='range'] .sdpi-item-value {
  min-height: 26px;
}

.sdpi-item[type='range'] .sdpi-item-value span,
.sdpi-item[type='meter'] .sdpi-item-child span,
.sdpi-item[type='progress'] .sdpi-item-child span {
  margin-top: -2px;
  min-width: 8px;
  text-align: right;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

.sdpi-item[type='range'] .sdpi-item-value span {
  margin-top: 7px;
  text-align: right;
}

span + input[type='range'] {
  display: flex;
}

span + .range-container > input[type='range'],
span + input[type='range'] {
  max-width: 168px;
}

.sdpi-item[type='range'] .sdpi-item-value span:first-child,
.sdpi-item[type='meter'] .sdpi-item-child span:first-child,
.sdpi-item[type='progress'] .sdpi-item-child span:first-child {
  margin-right: 4px;
}

.sdpi-item[type='range'] .sdpi-item-value span:last-child,
.sdpi-item[type='meter'] .sdpi-item-child span:last-child,
.sdpi-item[type='progress'] .sdpi-item-child span:last-child {
  margin-left: 4px;
}

.reverse {
  transform: rotate(180deg);
}

.sdpi-item[type='meter'] .sdpi-item-child meter + span:last-child {
  margin-left: -10px;
}

.sdpi-item[type='progress'] .sdpi-item-child meter + span:last-child {
  margin-left: -14px;
}

.sdpi-item[type='radio'] > .sdpi-item-value > * {
  margin-top: 2px;
}

details {
  padding: 8px 18px 8px 12px;
  min-width: 86px;
}

details > h4 {
  border-bottom: 1px solid var(--sdpi-bordercolor);
}

legend {
  display: none;
}

.sdpi-item-value > textarea {
  padding: 0px;
  width: 219px;
  margin-left: 1px;
  margin-top: 3px;
  padding: 4px;
}

input[type='radio'] + label span,
input[type='checkbox'] + label span {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin: 2px 4px 2px 0;
  border-radius: 3px;
  vertical-align: middle;
  background: var(--sdpi-background);
  cursor: pointer;
  border: 1px solid rgb(0, 0, 0, 0.2);
}

input[type='radio'] + label span {
  border-radius: 100%;
}

input[type='radio']:checked + label span,
input[type='checkbox']:checked + label span {
  background-color: #77f;
  background-image: url("data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20width='12'%20height='10'%20viewBox='0%200%2012%2010'%3e%3cpolygon%20fill='%23FFF'%20points='7.2%207.5%207.2%20-1.3%208.7%20-1.3%208.6%209.1%202.7%208.7%202.7%207.2'%20transform='rotate(37%205.718%203.896)'/%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: center center;
  border: 1px solid rgb(0, 0, 0, 0.4);
}

input[type='radio']:active:checked + label span,
input[type='radio']:active + label span,
input[type='checkbox']:active:checked + label span,
input[type='checkbox']:active + label span {
  background-color: #303030;
}

input[type='radio']:checked + label span {
  background-image: url("data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20width='6'%20height='6'%20viewBox='0%200%206%206'%3e%3ccircle%20cx='3'%20cy='3'%20r='3'%20fill='%23FFF'/%3e%3c/svg%3e");
}

input[type='range'] {
  width: var(--sdpi-width);
  height: 30px;
  overflow: hidden;
  cursor: pointer;
  background: transparent !important;
}

.sdpi-item > input[type='range'] {
  margin-left: 2px;
  max-width: var(--sdpi-width);
  width: var(--sdpi-width);
  padding: 0px;
  margin-top: 2px;
}

/*
input[type="range"],
input[type="range"]::-webkit-slider-runnable-track,
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
}
*/

input[type='range']::-webkit-slider-runnable-track {
  height: 5px;
  background: #979797;
  border-radius: 3px;
  padding: 0px !important;
  border: 1px solid var(--sdpi-background);
}

input[type='range']::-webkit-slider-thumb {
  position: relative;
  -webkit-appearance: none;
  background-color: var(--sdpi-color);
  width: 12px;
  height: 12px;
  border-radius: 20px;
  margin-top: -5px;
  border: none;
}

input[type='range' i] {
  margin: 0;
}

input[type='range']::-webkit-slider-thumb::before {
  position: absolute;
  content: '';
  height: 5px; /* equal to height of runnable track or 1 less */
  width: 500px; /* make this bigger than the widest range input element */
  left: -502px; /* this should be -2px - width */
  top: 8px; /* don't change this */
  background: #77f;
}

input[type='color'] {
  min-width: 32px;
  min-height: 32px;
  width: 32px;
  height: 32px;
  padding: 0;
  background-color: var(--sdpi-bgcolor);
  flex: none;
}

::-webkit-color-swatch {
  min-width: 24px;
}

textarea {
  height: 3em;
  word-break: break-word;
  line-height: 1.5em;
}

.textarea {
  padding: 0px !important;
}

textarea {
  width: 219px; /*98%;*/
  height: 96%;
  min-height: 6em;
  resize: none;
  border-radius: var(--sdpi-borderradius);
}

/* CAROUSEL */

.sdpi-item[type='carousel'] {
}

.sdpi-item.card-carousel-wrapper,
.sdpi-item > .card-carousel-wrapper {
  padding: 0;
}

.card-carousel-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 12px auto;
  color: #666a73;
}

.card-carousel {
  display: flex;
  justify-content: center;
  width: 278px;
}

.kelvin::after {
  content: 'K';
}

.mired::after {
  content: ' Mired';
}

.percent::after {
  content: '%';
}

.sdpi-item-value + .icon-cooler,
.sdpi-item-value + .icon-warmer {
  margin-left: 0px !important;
  margin-top: 15px !important;
}

/**
  CONTROL-CENTER STYLES
*/
input[type='range'].colorbrightness::-webkit-slider-runnable-track,
input[type='range'].colortemperature::-webkit-slider-runnable-track {
  height: 8px;
  background: #979797;
  border-radius: 4px;
  background-image: linear-gradient(to right, #94d0ec, #ffb165);
}

input[type='range'].colorbrightness.greyscale::-webkit-slider-runnable-track,
input[type='range'].colorbrightness.grayscale::-webkit-slider-runnable-track {
  background-color: #efefef;
  background-image: linear-gradient(to right, black, rgba(0, 0, 0, 0));
}

input[type='range'].colorbrightness::-webkit-slider-thumb,
input[type='range'].colortemperature::-webkit-slider-thumb {
  width: 16px;
  height: 16px;
  border-radius: 20px;
  margin-top: -5px;
  background-color: #86c6e8;
  box-shadow: 0px 0px 1px #000000;
  border: 1px solid #d8d8d8;
}

.sdpi-info-label {
  display: inline-block;
  user-select: none;
  position: absolute;
  height: 15px;
  width: auto;
  text-align: center;
  border-radius: 4px;
  min-width: 44px;
  max-width: 80px;
  background: white;
  font-size: 11px;
  color: black;
  z-index: 1000;
  box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.8);
  padding: 2px;
}

.sdpi-info-label.hidden {
  opacity: 0;
  transition: opacity 0.25s linear;
}

.sdpi-info-label.shown {
  position: absolute;
  opacity: 1;
  transition: opacity 0.25s ease-out;
}

/* adding some styles here that override sdpi things so we can use this as notes for sdpi updates*/
select {
  min-width: 0px;

  /* this is a clunky fix for using background image as select arrow with long text options */
  -webkit-appearance: media-slider;
  text-overflow: ellipsis;
}

/*--------- context menu ----------*/

.context-menu {
  display: none;
  position: absolute;
  z-index: 10;
  padding: 12px 0;
  width: 120px;
  background-color: #3d3d3d;
  border: solid 1px #dfdfdf;
  box-shadow: 1px 1px 2px #cfcfcf;
}

.context-menu--active {
  display: block;
}

.context-menu__items {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow-y: auto;
}

.context-menu__item {
  display: block;
  margin-bottom: 4px;
  background-color: #3d3d3d !important;
}

.context-menu__item:last-child {
  margin-bottom: 0;
}

.context-menu__link {
  display: block;
  padding: 4px 12px;
  color: #ffff;
  text-decoration: none;
  white-space: nowrap;
}

.context-menu__link:hover {
  color: #fff;
  background-color: #0066aa;
}

.context-menu_message {
  cursor: default;
}</style>
</head>

<body>
  <div style="display: none" class="sdpi-wrapper" id="property-inspector">
    <form class="with-account-wrapper">
      <div class="sdpi-item no-account">
        <div class="sdpi-item-label" id="client-id-label">ClientId</div>
        <input class="sdpi-item-value" id="client-id" name="ClientId" />
      </div>

      <div class="sdpi-item no-account">
        <div class="sdpi-item-label" id="client-id-label">ClientSecret</div>
        <input class="sdpi-item-value" id="client-secret" name="ClientSecret" />
      </div>

      <div class="sdpi-item no-account">
        <div class="sdpi-item-label empty"></div>
        <button class="sdpi-item-value" id="confirm">
          <img id="confirm-loader" src="data:image/svg+xml,%3csvg%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%20xmlns='http://www.w3.org/2000/svg'%3e%3cstyle%3e.spinner_P7sC{transform-origin:center;animation:spinner_svv2%20.75s%20infinite%20linear}@keyframes%20spinner_svv2{100%25{transform:rotate(360deg)}}%3c/style%3e%3cpath%20d='M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z'%20class='spinner_P7sC'%20fill='%23d8d8d8'%20/%3e%3c/svg%3e" />
          <span id="confirm-text" data-localize="Connect"></span>
        </button>
      </div>

      <div class="sdpi-item no-account">
        <details class="message info no-marker">
          <summary style="font-size: 12px; font-weight: 400;">
            <span style="color: red" data-localize="Guide Title"></span>
            <span data-localize="Guide Content"></span>
            <a id="instructions-link" data-localize="Guide Link"></a>
          </summary>
        </details>
      </div>
    </form>
  </div>
</body>
